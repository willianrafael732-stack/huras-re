<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Hurras Fantasy — Catálogo</title>
    <link rel="stylesheet" href="../hurras-nav.css">
    <style>
        body {
            margin: 0;
            background: #090709;
            color: #f3e9dc;
            font-family: Arial
        }

        .wrap {
            width: min(1400px, calc(100% - 24px));
            margin: auto;
            padding: 35px 0 70px
        }

        h1,
        h2 {
            font-family: Georgia, serif;
            color: #e5bd78
        }

        h1 {
            font-size: clamp(32px, 5vw, 58px)
        }

        .intro {
            color: #ae9d8c
        }

        .bar {
            position: sticky;
            top: 0;
            padding: 12px 0;
            background: #090709ee;
            display: flex;
            gap: 10px
        }

        .bar input,
        .bar select {
            flex: 1;
            padding: 12px;
            background: #120e12;
            color: #f3e9dc;
            border: 1px solid #543d2c;
            border-radius: 8px
        }

        section {
            margin: 22px 0;
            padding: 18px;
            border: 1px solid #382b28;
            border-radius: 12px;
            background: #100d10
        }

        section.hide {
            display: none
        }

        header {
            display: flex;
            justify-content: space-between
        }

        header b {
            color: #e5bd78
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 9px
        }

        a {
            display: block;
            padding: 12px;
            border: 1px solid #3d302b;
            border-radius: 8px;
            background: #171116;
            color: #f3e9dc;
            text-decoration: none
        }

        a:hover {
            border-color: #e5bd78
        }

        a strong,
        a small {
            display: block;
            overflow-wrap: anywhere
        }

        a small {
            color: #ae9d8c;
            font-size: 11px;
            margin-top: 4px
        }

        @media(max-width:600px) {
            .wrap {
                width: calc(100% - 14px);
                padding-top: 18px
            }

            .bar {
                position: static;
                flex-direction: column
            }

            .grid {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <main class="wrap">
        <h1>Catálogo de Hurras Fantasy</h1>
        <p class="intro">Acesse as páginas ativas do Hurras por área, sem atalhos repetidos, login desativado ou
            redirecionamentos antigos.</p>
        <div class="grid"><a href="bestiario/index.html"><strong>☠ Bestiário organizado</strong><small>110 criaturas +
                    19 seres nórdicos</small></a><a href="deuses2/index.html"><strong>✧ Deuses e
                    semideuses</strong><small>Panteões e fichas completas</small></a><a
                href="catalogo/index.html"><strong>📜 Catálogo complementar</strong><small>11 adversários + 5
                    documentos</small></a></div>
        <div class="bar"><input id="q" placeholder="Buscar página"><select id="f">
                <option value="">Todas as áreas</option>
                <option>animais</option>
                <option>armas</option>
                <option>classes</option>
                <option>funcoes</option>
                <option>npc</option>
                <option>profissao</option>
                <option>raca</option>
            </select></div>
        <div id="catalog"></div>
    </main>
    <script>const pages = ["animais/animais.html", "animais/ficha-animal.html", "armas/Instrumentais.html", "armas/Runas.html", "armas/armaduras.html", "armas/armas.html", "armas/curtoalacance.html", "armas/encantos.html", "armas/escudo.html", "armas/longo.html", "armas/magicos.html", "armas/medioalcance.html", "armas/medioalcance2M.html", "classes/Troll.html", "classes/anao.html", "classes/anjo.html", "classes/demonio.html", "classes/djinn.html", "classes/draconiano.html", "classes/elfo.html", "classes/fada.html", "classes/faunos.html", "classes/gigante.html", "classes/goblin.html", "classes/homem-fera.html", "classes/humano.html", "classes/lich.html", "classes/lobisomem.html", "classes/meio-elfo.html", "classes/meio-orc.html", "classes/metamorfo.html", "classes/minotauro.html", "classes/orc.html", "classes/reptiliano.html", "classes/sereianos.html", "classes/vampiro.html", "classes/zumbi.html", "funcoes/INGREDIENTES.HTML", "funcoes/alquimia.html", "funcoes/arena-batalha.html", "funcoes/arquivo-npcs.html", "funcoes/bestiario.html", "funcoes/bestiario/index.html", "funcoes/biblioteca.html", "funcoes/clan.html", "funcoes/criacao-de-ficha.html", "funcoes/criacao-de-ficha.html", "funcoes/deuses2/index.html", "funcoes/catalogo/index.html", "funcoes/clan.html", "funcoes/galeria-i.html", "funcoes/grimorio-elemental-legado.html", "funcoes/habilidades.html", "funcoes/index.html", "funcoes/inimigo.html", "funcoes/magia.html", "funcoes/mestre-fichas.html", "funcoes/mestre-npcs.html", "funcoes/mestre.html", "funcoes/minerios.html", "funcoes/novas-origens.html", "funcoes/npcs-mestre.html", "funcoes/npcs.html", "funcoes/origem.html", "funcoes/personagens.html", "funcoes/porcao.html", "funcoes/racaeclasses.html", "funcoes/sistema-completo.html", "profissao/profissoes.html", "raca/arqueiro.html", "raca/bardo.html", "raca/bruxo.html", "raca/clerigo.html", "raca/domador.html", "raca/druida.html", "raca/guerreiro.html", "raca/ladino.html", "raca/lanceiro.html", "raca/mago.html", "raca/monge.html", "raca/necromante.html", "raca/ninja.html", "raca/tecnomancer.html", "raca/transmutador.html"]; const c = document.querySelector('#catalog'), groups = {}; pages.forEach(p => (groups[p.split('/')[0]] ??= []).push(p)); const label = p => p.split('/').pop().replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').replace(/\b\w/g, x => x.toUpperCase()); c.innerHTML = Object.entries(groups).map(([g, ps]) => '<section data-area="' + g + '"><header><h2>' + g + '</h2><b>' + ps.length + '</b></header><div class="grid">' + ps.map(p => '<a href="../' + p + '"><strong>' + label(p) + '</strong><small>' + p + '</small></a>').join('') + '</div></section>').join(''); const q = document.querySelector('#q'), f = document.querySelector('#f'); function fil() { let s = q.value.toLowerCase(), g = f.value; document.querySelectorAll('section').forEach(sec => { let okg = !g || sec.dataset.area === g, n = 0; sec.querySelectorAll('a').forEach(a => { let ok = okg && a.textContent.toLowerCase().includes(s); a.hidden = !ok; if (ok) n++ }); sec.classList.toggle('hide', !n) }) } q.oninput = fil; f.onchange = fil;</script>
</body>

</html>
